# ============================================================
#  Underwater Feature Extraction — Optimized Configuration
# ============================================================

project:
  name: "underwater_feature_extraction"
  version: "1.0.1"
  seed: 42
  device: "cuda"          # "cuda" | "cpu" | "mps"
  amp: true               # Mixed precision (keep ON)

# ─── Data ────────────────────────────────────────────────────
data:
  dataset: "uieb"
  root: "data/"
  image_size: 224         # ↓ Reduced from 256 (memory efficient)
  full_size: 512
  num_workers: 2          # ↓ Reduced (safer for laptop GPU)
  pin_memory: true

  augmentation:
    horizontal_flip: true
    vertical_flip: false
    random_crop: true
    color_jitter: false
    random_rotation: 10

  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

# ─── Model ───────────────────────────────────────────────────
model:
  backbone: "resnet18"    # ↓ Lighter than resnet34
  pretrained: true
  in_channels: 3
  base_features: 64

  noise_estimator:
    in_channels: 3
    hidden_channels: [32, 64, 32]
    out_channels: 1

  illumination_estimator:
    in_channels: 3
    hidden_channels: [32, 64, 32]
    out_channels: 1

  attention:
    type: "eca"           # ↓ Lightweight attention (instead of CBAM)
    reduction_ratio: 16
    kernel_size: 3

  decoder:
    skip_connections: false   # ↓ Major VRAM saver
    output_channels: 3

  classifier:
    num_classes: 10
    dropout: 0.5
    hidden_dim: 256       # ↓ Reduced from 512

# ─── Training ────────────────────────────────────────────────
training:
  epochs: 100
  batch_size: 4           # ↓ Main OOM fix
  gradient_clip: 0.5
  log_interval: 10
  save_interval: 5
  val_interval: 1

  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    min_lr: 1.0e-6
    warmup_epochs: 5
    step_size: 30
    gamma: 0.5

  loss:
    reconstruction: 1.0
    perceptual: 0.05
    color_consistency: 0.3
    contrast: 0.2
    ssim: 0.3
    noise_regularization: 0.005
    illumination_smooth: 0.005

# ─── Evaluation ──────────────────────────────────────────────
evaluation:
  batch_size: 1
  metrics: ["psnr", "ssim", "uiqm", "uciqe"]
  save_visuals: true
  visual_count: 10

# ─── Paths ───────────────────────────────────────────────────
paths:
  checkpoints: "checkpoints/"
  outputs: "outputs/"
  logs: "logs/"
  best_model: "checkpoints/best_model.pth"

# ─── Logging ─────────────────────────────────────────────────
logging:
  use_tensorboard: true
  use_wandb: false
  wandb_project: "underwater_feature_extraction"
  log_images: true
  log_image_freq: 10